oefa_enable_center: true
oefa_enable_boundary: true
oefa_debug_stats: false
oefa_target_chunk: 32
scales:
  n: [0.50, 0.25, 1024]
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
