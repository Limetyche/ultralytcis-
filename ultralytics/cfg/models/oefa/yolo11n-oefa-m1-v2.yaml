  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, false]]
  - [[17, 11], 1, OEFABoundaryDownsampleV2, [0, true, 0.25, false]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, false]]
  - [[20, 11], 1, OEFABoundaryDownsampleV2, [1, true, 0.25, false]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, true]]
  - [[17, 20, 23], 1, Detect, [nc]]
